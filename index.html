<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모으다 — 작은 생각을 모아, 나만의 세상을 만들다</title><meta name="theme-color" content="#f8f6f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="모으다"><meta name="description" content="작은 생각을 모아, 나만의 세상을 만들다"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><style>
:root{--bg:#f8f6f1;--ink:#363744;--muted:#93929b;--line:#e9e5e1;--purple:#9b8bc5;--sage:#a5bca8;--pink:#e9b6bd;--yellow:#f0d9a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:245px;flex-shrink:0;background:#fffdfb;border-right:1px solid var(--line);padding:32px 18px;display:flex;flex-direction:column;gap:24px}.brand{padding:0 14px}.brand b{font-family:Georgia,serif;font-size:34px;letter-spacing:-2px;color:#8d7eb3}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:1px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px 15px;border-radius:12px;color:#777782;font-size:14px}.nav button.active{background:#f1edf9;color:#7b69a8;font-weight:700}.nav button:hover{background:#f6f3f9}.nav span{float:right;color:#a9a5b0}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:9px}.side-bottom button{background:none;border:0;text-align:left;color:#88838e;font-size:12px;padding:7px}.main{flex:1;min-width:0;padding:42px clamp(20px,5vw,78px) 70px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:12px;color:#a093bb;letter-spacing:2px;font-weight:700}.hello{font-family:Georgia,'Apple SD Gothic Neo',serif;font-size:clamp(29px,4vw,44px);font-weight:500;letter-spacing:-1.5px;margin:14px 0 9px}.subtitle{color:#93919b;font-size:14px;margin:0 0 32px}.primary{background:#9b8bc5;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700;box-shadow:0 5px 15px #9b8bc52a}.primary:hover{background:#8877b5}.hero{background:linear-gradient(110deg,#f0ebf7,#f9f1ed);border:1px solid #eee7f0;border-radius:20px;padding:25px 28px;display:flex;justify-content:space-between;align-items:center;margin-bottom:27px;gap:10px}.hero h2{font-size:19px;margin:0 0 8px;font-weight:650}.hero p{font-size:13px;color:#8d8797;margin:0;line-height:1.7}.flower{font-size:62px;opacity:.75}.toolbar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:22px}.search{flex:1;min-width:190px;max-width:400px;background:white;border:1px solid var(--line);border-radius:12px;padding:12px 15px;outline:none}.search:focus{border-color:var(--purple)}.select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;color:#777}.sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}.sectionhead h3{margin:0;font-size:17px}.sectionhead span{font-size:12px;color:#aaa}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.note{border:1px solid #ebe7e5;border-radius:17px;background:#fff;min-height:205px;padding:21px;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;cursor:pointer}.note:hover{transform:translateY(-3px);box-shadow:0 12px 25px #5d4f6a12}.note[data-color=lavender]{background:#f3effa}.note[data-color=sage]{background:#eff5ee}.note[data-color=peach]{background:#fcf0e9}.note[data-color=butter]{background:#faf5e6}.note-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.chip{font-size:11px;background:#ffffffa6;border:1px solid #ffffffbd;border-radius:50px;padding:5px 10px;color:#797280}.star{border:0;background:transparent;font-size:22px;color:#c7c1ca;padding:0 2px}.star.on{color:#d3a24b}.note h4{font-size:17px;margin:21px 0 10px;line-height:1.45}.preview{font-size:13px;line-height:1.75;color:#89858e;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}.note-bottom{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;color:#aaa2ac;font-size:11px;gap:8px}.tags{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}.empty{grid-column:1/-1;text-align:center;padding:65px 15px;border:1px dashed #ddd5e5;border-radius:18px;color:#a39aaa}.empty strong{display:block;font-size:18px;color:#726982;margin:12px}.mobilebar{display:none}.modal{position:fixed;inset:0;background:#2f2a3a85;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{background:#fffdfa;border-radius:20px;width:min(100%,570px);max-height:92vh;overflow:auto;padding:28px;box-shadow:0 24px 65px #28203435}.dialoghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.dialoghead h2{font-size:22px;margin:0}.iconbtn{background:#f3f0f4;border:0;border-radius:9px;width:34px;height:34px;font-size:20px;color:#777}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;color:#8c8591;font-weight:700}.field input,.field textarea,.field select{width:100%;background:white;border:1px solid #e5dfe6;border-radius:10px;padding:12px;outline:none;color:var(--ink)}.field textarea{resize:vertical;min-height:175px;line-height:1.7}.field input:focus,.field textarea:focus{border-color:var(--purple)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:10px}.danger{background:none;border:0;color:#c68188;font-size:13px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#454050;color:#fff;padding:12px 20px;border-radius:11px;display:none;z-index:20;font-size:13px}.toast.show{display:block}.footer{font-size:11px;color:#b5aeb8;margin-top:32px;text-align:center}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app{display:block}.sidebar{display:none}.mobilebar{display:flex;position:sticky;top:0;z-index:4;background:#fffdfbf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 17px;align-items:center;justify-content:space-between}.mobilebar b{font-family:Georgia,serif;color:#8d7eb3;font-size:25px}.mobilebar select{border:0;background:transparent;color:#73678e;padding:8px;max-width:170px}.main{padding:25px 17px 70px}.topline .primary{font-size:12px;padding:10px 12px}.hello{font-size:30px}.subtitle{font-size:12px}.hero{padding:19px}.hero h2{font-size:16px}.flower{font-size:42px}.cards{grid-template-columns:1fr}.note{min-height:180px}.twocol{grid-template-columns:1fr}.dialog{padding:21px}.toolbar{gap:8px}.search{max-width:none}}
</style></head><body><div class="mobilebar"><b>모으다.</b><select id="mobileNav" aria-label="메뉴"><option value="all">모든 아이디어</option><option value="star">즐겨찾기</option><option value="게임">🎮 게임</option><option value="글쓰기">✍️ 글쓰기</option><option value="디자인">🎨 디자인</option><option value="일상">🌿 일상</option><option value="기타">☁️ 기타</option></select></div><div class="app"><aside class="sidebar"><div class="brand"><b>모으다.</b><small>MY LITTLE IDEA COLLECTION</small></div><div class="nav" id="nav"><button data-view="all" class="active">✦ &nbsp; 모든 아이디어 <span id="totalSide">0</span></button><button data-view="star">☆ &nbsp; 즐겨찾기</button><div style="padding:19px 15px 6px;color:#b5aeb7;font-size:11px;letter-spacing:1px">COLLECTIONS</div><button data-view="게임">🎮 &nbsp; 게임</button><button data-view="글쓰기">✍️ &nbsp; 글쓰기</button><button data-view="디자인">🎨 &nbsp; 디자인</button><button data-view="일상">🌿 &nbsp; 일상</button><button data-view="기타">☁️ &nbsp; 기타</button></div><div class="side-bottom"><button id="exportBtn">↓ &nbsp; 아이디어 백업하기</button><button id="importBtn">↑ &nbsp; 백업 불러오기</button><input type="file" id="fileInput" accept="application/json,.json" hidden></div></aside><main class="main"><div class="topline"><span class="eyebrow">YOUR CREATIVE CORNER ✳</span><button class="primary" id="newBtn">＋ 새 아이디어</button></div><h1 class="hello">작은 생각들이 모이는 곳.</h1><p class="subtitle">반짝 떠오른 생각을 잊기 전에, 이곳에 살포시 담아두세요.</p><div class="hero"><div><h2>오늘은 어떤 생각이 떠올랐나요? ✿</h2><p>아주 사소한 아이디어도 괜찮아요.<br>언젠가 멋진 무언가가 될지도 모르니까요.</p></div><div class="flower">✿</div></div><div class="toolbar"><input class="search" id="search" placeholder="⌕  아이디어, 내용, 태그 검색..." aria-label="아이디어 검색"><select class="select" id="sort"><option value="recent">최근 수정순</option><option value="old">오래된 순</option><option value="title">제목순</option></select></div><div class="sectionhead"><h3 id="sectionTitle">모든 아이디어</h3><span id="count"></span></div><div class="cards" id="cards"></div><p class="footer">made for little sparks of inspiration ♡ · 이 기기의 브라우저에 저장됩니다</p></main></div><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><div class="dialoghead"><h2 id="dialogTitle">새로운 아이디어 ✨</h2><button class="iconbtn" id="close" aria-label="닫기">×</button></div><form id="form"><div class="field"><label for="title">아이디어 이름</label><input id="title" maxlength="120" placeholder="예: 달빛 아래 작은 서점" required></div><div class="twocol"><div class="field"><label for="category">카테고리</label><select id="category"><option>게임</option><option>글쓰기</option><option>디자인</option><option>일상</option><option>기타</option></select></div><div class="field"><label for="color">카드 색상</label><select id="color"><option value="lavender">💜 라벤더</option><option value="sage">🌿 세이지</option><option value="peach">🍑 피치</option><option value="butter">🍯 버터</option><option value="white">🤍 화이트</option></select></div></div><div class="field"><label for="content">생각을 자유롭게 적어보세요</label><textarea id="content" placeholder="아이디어의 줄거리, 떠오른 장면, 해야 할 일 등 무엇이든..."></textarea></div><div class="field"><label for="tags">태그 (쉼표로 구분)</label><input id="tags" placeholder="예: 픽셀아트, 힐링, 나중에 만들기"></div><div class="actions"><button class="danger" id="deleteBtn" type="button" style="display:none">아이디어 삭제</button><span id="newHint" style="font-size:12px;color:#a39ca6">생각의 씨앗을 심어봐요 🌱</span><button class="primary" type="submit">저장하기 ♡</button></div></form></div></div><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='moa-ideas-v1';const $=id=>document.getElementById(id);let notes=[],view='all',editing=null;const cats=['게임','글쓰기','디자인','일상','기타'];const emoji={게임:'🎮',글쓰기:'✍️',디자인:'🎨',일상:'🌿',기타:'☁️'};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2500)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));return true}catch(e){notify('저장에 실패했어요. 백업 파일을 만들어 주세요.');return false}}try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');notes=Array.isArray(data)?data:[]}catch(e){notes=[];notify('저장된 데이터를 읽을 수 없어요.')}function date(n){return new Date(n.updated||n.created||Date.now()).toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'})}function render(){let q=$('search').value.trim().toLocaleLowerCase();let filtered=notes.filter(n=>(view==='all'||(view==='star'?n.star:n.category===view))&&[n.title,n.content,...(n.tags||[])].join(' ').toLocaleLowerCase().includes(q));const sort=$('sort').value;filtered.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'ko'):sort==='old'?(a.updated||0)-(b.updated||0):(b.updated||0)-(a.updated||0));$('sectionTitle').textContent=view==='all'?'모든 아이디어':view==='star'?'즐겨찾기':(emoji[view]||'')+' '+view;$('count').textContent=filtered.length+'개의 생각';$('totalSide').textContent=notes.length;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('mobileNav').value=view;$('cards').innerHTML=filtered.length?filtered.map(n=>`<article class="note" data-id="${escape(n.id)}" data-color="${['lavender','sage','peach','butter','white'].includes(n.color)?n.color:'white'}" tabindex="0" role="button" aria-label="${escape(n.title)} 열기"><div class="note-top"><span class="chip">${emoji[n.category]||'☁️'} ${escape(n.category)}</span><button class="star ${n.star?'on':''}" data-star="${escape(n.id)}" aria-label="즐겨찾기 ${n.star?'해제':'추가'}">${n.star?'★':'☆'}</button></div><h4>${escape(n.title)}</h4><p class="preview">${escape(n.content||'아직 적힌 내용이 없어요.')}</p><div class="note-bottom"><span class="tags">${(n.tags||[]).map(t=>'#'+escape(t)).join(' ')}</span><span>${date(n)}</span></div></article>`).join(''):'<div class="empty"><div style="font-size:38px">✧</div><strong>아직 이곳은 조용하네요.</strong>첫 번째 아이디어를 남겨볼까요?</div>'}function open(id=null){editing=id;let n=notes.find(x=>x.id===id);$('dialogTitle').textContent=n?'아이디어 다듬기 ✎':'새로운 아이디어 ✨';$('title').value=n?.title||'';$('category').value=n?.category||'게임';$('color').value=n?.color||'lavender';$('content').value=n?.content||'';$('tags').value=(n?.tags||[]).join(', ');$('deleteBtn').style.display=n?'block':'none';$('newHint').style.display=n?'none':'block';$('modal').classList.add('show');setTimeout(()=>$('title').focus(),30)}function close(){$('modal').classList.remove('show');editing=null}document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;render()}));$('mobileNav').addEventListener('change',e=>{view=e.target.value;render()});$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('newBtn').addEventListener('click',()=>open());$('close').addEventListener('click',close);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();$('search').focus()}});$('cards').addEventListener('click',e=>{const star=e.target.closest('[data-star]');if(star){e.stopPropagation();let n=notes.find(x=>x.id===star.dataset.star);if(n){n.star=!n.star;n.updated=Date.now();persist();render()}return}let card=e.target.closest('[data-id]');if(card)open(card.dataset.id)});$('cards').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.note')){e.preventDefault();open(e.target.dataset.id)}});$('form').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;let n=notes.find(x=>x.id===editing),now=Date.now();let data={title,category:$('category').value,color:$('color').value,content:$('content').value,tags:[...new Set($('tags').value.split(',').map(x=>x.trim()).filter(Boolean))],updated:now};if(n)Object.assign(n,data);else notes.unshift({id:uid(),created:now,star:false,...data});persist();render();close();notify('아이디어를 소중히 담아뒀어요 ♡')});$('deleteBtn').addEventListener('click',()=>{if(!editing||!confirm('이 아이디어를 정말 삭제할까요?'))return;notes=notes.filter(n=>n.id!==editing);persist();render();close();notify('아이디어를 삭제했어요')});$('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'moeuda',version:1,exportedAt:new Date().toISOString(),notes},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moeuda-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('백업 파일을 준비했어요')});$('importBtn').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const arr=Array.isArray(data)?data:data.notes;if(!Array.isArray(arr)||arr.some(n=>!n||typeof n.title!=='string'||typeof n.id!=='string'))throw Error('invalid');if(!confirm('백업에서 '+arr.length+'개를 불러올까요? 같은 ID의 아이디어는 백업 내용으로 교체됩니다.'))return;const map=new Map(notes.map(n=>[n.id,n]));for(const n of arr){map.set(n.id,{id:n.id,title:n.title.slice(0,120),category:cats.includes(n.category)?n.category:'기타',color:['lavender','sage','peach','butter','white'].includes(n.color)?n.color:'white',content:String(n.content||''),tags:Array.isArray(n.tags)?n.tags.filter(t=>typeof t==='string'):[],star:!!n.star,created:Number(n.created)||Date.now(),updated:Number(n.updated)||Date.now()})}notes=[...map.values()];persist();render();notify('백업을 불러왔어요 ♡')}catch(err){notify('올바른 아이디어 백업 파일이 아니에요')}finally{e.target.value=''}});render()})();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
